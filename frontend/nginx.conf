# nginx configuration for the production Smart Travel Planner frontend.
#
# Responsibilities:
#   1. Serve the Vite-built SPA from /usr/share/nginx/html.
#   2. Proxy all /api/* requests to the backend service.  In docker-compose
#      the backend is reachable at http://backend:8000; the proxy_pass below
#      uses the service name so it resolves correctly inside the Docker network.
#   3. Fall back to index.html for any path not matching a static file, enabling
#      React Router's client-side routing to take over.
#
# Security headers (X-Frame-Options, CSP, etc.) should be added here before
# deploying to a public environment.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback — all unknown paths return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
