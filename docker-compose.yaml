# docker-compose.yaml — full stack orchestration for Smart Travel Planner.
#
# Services:
#   db        — Postgres 16 + pgvector; init script enables the vector extension.
#   ollama    — Local LLM server that hosts the nomic-embed-text embedding model.
#   ollama-init — One-shot init container that pulls nomic-embed-text on first
#                 run.  Skipped automatically on subsequent restarts because the
#                 model file is persisted in the `ollama_models` named volume.
#   backend   — FastAPI application (async, uvicorn).
#   frontend  — React SPA served by nginx; proxies /api → backend.
#   pgadmin   — Optional pgAdmin 4 UI for inspecting the database.
#
# All application secrets are read from a .env file (copy from .env.example).
# Service-to-service communication uses Docker service names (no hardcoded IPs).
#
# Named volumes:
#   postgres_data   — database files survive container restarts / recreates.
#   ollama_models   — pulled model weights survive restarts (avoids re-download).
#   pgadmin_data    — pgAdmin server definitions survive restarts.
#
# Usage:
#   cp .env.example .env        # fill in API keys
#   docker compose up -d        # start all services
#   docker compose logs -f backend  # follow backend logs
#   docker compose down -v      # stop + remove volumes (clean slate)

services:

  # ─── Postgres 16 + pgvector ───────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: stp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-travel}
    ports:
      - "5432:5432"
    networks:
      - stp_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # runs CREATE EXTENSION vector on first init
      - ./infra/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel} -d ${POSTGRES_DB:-travel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Ollama embedding server ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: stp_ollama
    restart: unless-stopped
    networks:
      - stp_network
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── One-shot model pull (runs only once; model persisted in volume) ───────
  ollama-init:
    image: curlimages/curl:8.10.1
    container_name: stp_ollama_init
    restart: "no"
    networks:
      - stp_network
    volumes:
      - ./infra/ollama/pull-models.sh:/pull-models.sh:ro
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    environment:
      # OLLAMA_SERVICE_HOST is defined in .env (default: ollama:11434).
      # The init script uses this to wait for the server before pulling the model.
      OLLAMA_HOST: ${OLLAMA_SERVICE_HOST:-ollama:11434}
    depends_on:
      ollama:
        condition: service_healthy

  # ─── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stp_backend
    restart: unless-stopped
    # All configuration — including POSTGRES_HOST, POSTGRES_PORT, OLLAMA_BASE_URL,
    # GOOGLE_API_KEY, JWT_SECRET, etc. — is loaded exclusively from .env.
    # No values are hardcoded here. Copy .env.example → .env and fill in secrets.
    env_file: .env
    ports:
      - "8000:8000"
    networks:
      - stp_network
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── React + nginx frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: stp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - stp_network
    depends_on:
      backend:
        condition: service_healthy

  # ─── pgAdmin 4 (optional, development convenience) ────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: stp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
    ports:
      - "8080:80"
    networks:
      - stp_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

networks:
  stp_network:
    driver: bridge

volumes:
  postgres_data:
  ollama_models:
  pgadmin_data:
