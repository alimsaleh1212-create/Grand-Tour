# docker-compose.yaml — full stack orchestration for Smart Travel Planner.
#
# Services:
#   db          — Postgres 16 + pgvector; init script enables the vector extension.
#   vault       — HashiCorp Vault (dev mode); stores all application secrets.
#   vault-init  — One-shot container; seeds secrets from .env into Vault KV v2.
#   backend     — FastAPI application (async, uvicorn); reads secrets from Vault.
#   frontend    — React SPA served by nginx; proxies /api → backend.
#   pgadmin     — Optional pgAdmin 4 UI for inspecting the database.
#
# Startup order: db → vault → vault-init (one-shot) → backend → frontend
#
# Secrets flow:
#   .env (POSTGRES_PASSWORD, JWT_SECRET, GOOGLE_API_KEY, …)
#     └─ vault-init seeds into Vault at secret/travel-planner
#         └─ backend fetches from Vault at module import time (before Settings)
#
# Named volumes:
#   postgres_data   — database files survive container restarts / recreates.
#   pgadmin_data    — pgAdmin server definitions survive restarts.
#   vault_data      — Vault storage (dev mode is in-memory; volume for future use).
#
# Usage:
#   cp .env.example .env        # fill in API keys
#   docker compose up -d        # start all services
#   docker compose logs -f backend  # follow backend logs
#   docker compose down -v      # stop + remove volumes (clean slate)

services:

  # ─── Postgres 16 + pgvector ───────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: stp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-travel}
    ports:
      - "5432:5432"
    networks:
      - stp_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # runs CREATE EXTENSION vector on first init
      - ./infra/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel} -d ${POSTGRES_DB:-travel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── HashiCorp Vault (dev mode) ───────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: stp_vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    networks:
      - stp_network
    volumes:
      - vault_data:/vault/data
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ─── Vault initialiser (one-shot secret seeder) ───────────────────────────
  vault-init:
    image: hashicorp/vault:1.17
    container_name: stp_vault_init
    restart: "no"
    env_file: .env
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    networks:
      - stp_network
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./infra/vault/seed-secrets.sh:/seed-secrets.sh:ro
    entrypoint: ["sh", "/seed-secrets.sh"]

  # ─── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stp_backend
    restart: unless-stopped
    # All configuration — including POSTGRES_HOST, GOOGLE_API_KEY, JWT_SECRET,
    # etc. — is loaded exclusively from .env. No values are hardcoded here.
    # Copy .env.example → .env and fill in secrets.
    env_file: .env
    ports:
      - "8000:8000"
    networks:
      - stp_network
    depends_on:
      db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── React + nginx frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: stp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - stp_network
    depends_on:
      backend:
        condition: service_healthy

  # ─── pgAdmin 4 (optional, development convenience) ────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: stp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
    ports:
      - "8080:80"
    networks:
      - stp_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

networks:
  stp_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  vault_data:
