[project]
name = "smart-travel-planner-backend"
version = "0.1.0"
description = "FastAPI backend for the Smart Travel Planner agent"
readme = "../README.md"
requires-python = ">=3.12,<3.13"

# Production dependencies — pinned exactly per CLAUDE.md §17.
# Versions to be confirmed during Stage 1 (`uv sync`); the list below is the
# canonical set; pins will be added as soon as the lockfile is generated.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic[email]==2.10.3",
    "pydantic-settings==2.7.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    "google-generativeai==0.8.3",
    "langgraph==0.2.59",
    "langchain-core==0.3.28",
    "langsmith==0.2.4",
    "httpx==0.28.1",
    "tenacity==9.0.0",
    "cachetools==5.5.0",
    "bcrypt==4.2.1",
    "pyjwt==2.10.1",
    "python-multipart==0.0.20",
    "structlog==24.4.0",
    "scikit-learn==1.6.0",
    "joblib==1.4.2",
    "numpy==2.2.0",
    "pandas==2.2.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "anyio==4.7.0",
    "black==24.10.0",
    "isort==5.13.2",
    "flake8==7.1.1",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "types-cachetools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
